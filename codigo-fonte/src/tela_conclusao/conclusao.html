<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parabéns! Etapa Concluída</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #b8d8e8;
    --panel: #d0eaf5;
    --border-dark: #4a7a9b;
    --border-light: #e8f4fb;
    --teal: #5bbfbf;
    --teal-dark: #3a9494;
    --teal-light: #a0dfdf;
    --red-cross: #cc3333;
    --text-dark: #1a3a5c;
    --text-title: #1a5c8a;
    --gold: #f0b800;
    --gold-light: #ffd84d;
    --white: #f0f8ff;
    --btn-green: #4caf50;
    --btn-green-dark: #2d7a30;
    --btn-blue: #3a7abf;
    --btn-blue-dark: #1a5a9f;
    --pixel: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* ── Scanline overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.04) 3px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── Main container ── */
  .screen {
    width: 760px;
    max-width: 98vw;
    background: var(--panel);
    border: var(--pixel) solid var(--border-dark);
    box-shadow:
      inset 2px 2px 0 var(--border-light),
      inset -2px -2px 0 var(--border-dark),
      6px 6px 0 rgba(0,0,0,0.25);
    padding: 20px 24px 24px;
    position: relative;
  }

  /* ── Title bar ── */
  .title-bar {
    text-align: center;
    margin-bottom: 16px;
  }
  .title-bar h1 {
    font-size: 11px;
    color: var(--text-title);
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
    animation: flicker 3s infinite;
  }
  .title-bar .coin {
    display: inline-block;
    font-size: 14px;
    margin-left: 6px;
    animation: spin-coin 1.2s steps(1) infinite;
  }
  .title-bar p {
    font-size: 5px;
    color: var(--text-dark);
    margin-top: 6px;
    opacity: 0.8;
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.7; }
  }
  @keyframes spin-coin {
    0%   { content: '🟡'; transform: scaleX(1); }
    25%  { transform: scaleX(0.5); }
    50%  { transform: scaleX(0); }
    75%  { transform: scaleX(0.5); }
    100% { transform: scaleX(1); }
  }

  /* ── Layout: left panel + right side ── */
  .layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  /* ── Trophy / video area (left) ── */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-done-box {
    width: 100%;
    aspect-ratio: 16/9;
    background: #1a3a5c;
    border: var(--pixel) solid var(--border-dark);
    box-shadow: inset 2px 2px 0 #0a1a2c, inset -2px -2px 0 #3a6a9c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .video-done-box .pixel-checkmark {
    font-size: 36px;
    animation: pop-in 0.5s cubic-bezier(.3,1.6,.5,1) both;
    filter: drop-shadow(0 0 8px var(--gold));
  }
  .video-done-box .done-label {
    font-size: 6px;
    color: var(--gold);
    margin-top: 10px;
    text-shadow: 0 0 6px var(--gold);
    animation: blink-text 1s steps(1) infinite;
  }

  @keyframes pop-in {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes blink-text {
    0%,49% { opacity: 1; }
    50%,100% { opacity: 0; }
  }

  /* Stars row */
  .stars-row {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .star {
    font-size: 22px;
    filter: grayscale(1);
    transition: filter 0.3s;
    animation: star-appear 0.4s ease both;
  }
  .star.lit {
    filter: grayscale(0) drop-shadow(0 0 6px var(--gold));
  }
  .star:nth-child(1) { animation-delay: 0.6s; }
  .star:nth-child(2) { animation-delay: 0.9s; }
  .star:nth-child(3) { animation-delay: 1.2s; }

  @keyframes star-appear {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* Progress bar */
  .progress-section {
    margin-top: 4px;
  }
  .progress-label {
    font-size: 5px;
    color: var(--text-dark);
    margin-bottom: 6px;
  }
  .progress-track {
    width: 100%;
    height: 14px;
    background: #1a3a5c;
    border: var(--pixel) solid var(--border-dark);
    box-shadow: inset 1px 1px 0 #0a1a2c;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(
      90deg,
      var(--teal) 0px,
      var(--teal) 8px,
      var(--teal-dark) 8px,
      var(--teal-dark) 10px
    );
    box-shadow: inset 0 2px 0 var(--teal-light);
    transition: width 1.5s cubic-bezier(.1,1,.3,1);
  }
  .progress-fill.animated { width: 66%; }
  .progress-text {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    font-size: 5px;
    color: var(--white);
    text-shadow: 1px 1px 0 #000;
  }

  /* ── Right side ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    min-width: 160px;
  }

  /* Reception sign */
  .sign-reception {
    background: var(--white);
    border: var(--pixel) solid var(--border-dark);
    box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 var(--border-dark);
    padding: 6px 14px;
    font-size: 7px;
    color: var(--text-dark);
    letter-spacing: 1px;
    align-self: flex-end;
  }

  /* Pixel character (nurse sprite) */
  .nurse-sprite {
    width: 64px;
    height: 64px;
    position: relative;
    animation: nurse-bounce 0.8s steps(2) infinite;
  }
  @keyframes nurse-bounce {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }

  /* Medical desk */
  .med-desk {
    width: 120px;
    height: 70px;
    background: var(--white);
    border: var(--pixel) solid var(--border-dark);
    box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 var(--border-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .cross-icon {
    width: 44px;
    height: 44px;
    position: relative;
  }
  .cross-icon::before,
  .cross-icon::after {
    content: '';
    position: absolute;
    background: var(--red-cross);
  }
  .cross-icon::before {
    width: 14px; height: 44px;
    left: 50%; transform: translateX(-50%);
  }
  .cross-icon::after {
    height: 14px; width: 44px;
    top: 50%; transform: translateY(-50%);
  }

  /* ── Chairs row ── */
  .chairs-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
    justify-content: flex-start;
  }

  .pixel-chair {
    width: 44px;
    height: 52px;
    position: relative;
  }
  .chair-back {
    width: 44px;
    height: 30px;
    background: var(--teal);
    border: var(--pixel) solid var(--teal-dark);
    box-shadow: inset 2px 2px 0 var(--teal-light), inset -2px -2px 0 var(--teal-dark);
    position: absolute;
    top: 0;
  }
  .chair-seat {
    width: 44px;
    height: 14px;
    background: var(--teal);
    border: var(--pixel) solid var(--teal-dark);
    box-shadow: inset 2px 2px 0 var(--teal-light), inset -2px -2px 0 var(--teal-dark);
    position: absolute;
    top: 28px;
  }
  .chair-legs {
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
    position: absolute;
    width: 44px;
    top: 40px;
  }
  .chair-leg {
    width: 6px;
    height: 12px;
    background: var(--teal-dark);
  }

  /* ── Message box ── */
  .message-box {
    background: var(--white);
    border: var(--pixel) solid var(--border-dark);
    box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 var(--border-dark);
    padding: 10px 14px;
    margin-top: 8px;
    text-align: center;
    animation: slide-up 0.5s ease 0.3s both;
  }
  .message-box p {
    font-size: 6px;
    color: var(--text-dark);
    line-height: 2;
  }
  .message-box .name-highlight {
    color: var(--teal-dark);
  }

  @keyframes slide-up {
    from { transform: translateY(16px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* ── Buttons ── */
  .buttons-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    justify-content: center;
  }

  .pixel-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    padding: 10px 16px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .pixel-btn:active { transform: translateY(3px); }

  .btn-next {
    background: var(--btn-green);
    color: #fff;
    border-top: 4px solid #80d880;
    border-left: 4px solid #80d880;
    border-bottom: 4px solid var(--btn-green-dark);
    border-right: 4px solid var(--btn-green-dark);
    box-shadow: 3px 3px 0 #1a4a1c;
    animation: pulse-btn 1.5s ease infinite;
  }
  .btn-next:hover { background: #5cbf60; }

  .btn-menu {
    background: var(--btn-blue);
    color: #fff;
    border-top: 4px solid #7ab0e8;
    border-left: 4px solid #7ab0e8;
    border-bottom: 4px solid var(--btn-blue-dark);
    border-right: 4px solid var(--btn-blue-dark);
    box-shadow: 3px 3px 0 #0a2a5c;
  }
  .btn-menu:hover { background: #4a8acf; }

  @keyframes pulse-btn {
    0%,100% { box-shadow: 3px 3px 0 #1a4a1c; }
    50%      { box-shadow: 3px 3px 0 #1a4a1c, 0 0 10px rgba(76,175,80,0.5); }
  }

  /* ── Confetti particles ── */
  .confetti-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 99;
  }
  .confetti-particle {
    position: absolute;
    width: 8px;
    height: 8px;
    opacity: 0;
    animation: confetti-fall linear both;
    image-rendering: pixelated;
  }
  @keyframes confetti-fall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<!-- Confetti -->
<div class="confetti-wrap" id="confetti"></div>

<div class="screen">

  <!-- Title bar -->
  <div class="title-bar">
    <h1>Acessados recentemente <span class="coin">🟡</span></h1>
    <p>Reveja as experiências incríveis que você já passou!</p>
  </div>

  <!-- Main layout -->
  <div class="layout">

    <!-- Left: video done box + stars + progress -->
    <div class="left-panel">

      <div class="video-done-box">
        <div class="pixel-checkmark">✅</div>
        <div class="done-label">VÍDEO CONCLUÍDO!</div>
      </div>

      <div class="stars-row">
        <div class="star lit" id="s1">⭐</div>
        <div class="star lit" id="s2">⭐</div>
        <div class="star" id="s3">⭐</div>
      </div>

      <div class="progress-section">
        <div class="progress-label">PROGRESSO DA JORNADA</div>
        <div class="progress-track">
          <div class="progress-fill" id="pbar"></div>
          <div class="progress-text">2 / 3 ETAPAS</div>
        </div>
      </div>

    </div>

    <!-- Right: sign + nurse + desk -->
    <div class="right-panel">

      <div class="sign-reception">RECEPÇÃO</div>

      <!-- Pixel nurse sprite (SVG) -->
      <svg class="nurse-sprite" viewBox="0 0 32 48" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated">
        <!-- cap -->
        <rect x="10" y="2" width="12" height="4" fill="#ffffff"/>
        <rect x="13" y="1" width="6" height="2" fill="#ffffff"/>
        <rect x="14" y="2" width="2" height="2" fill="#cc3333"/>
        <rect x="14" y="0" width="2" height="1" fill="#cc3333"/>
        <!-- head -->
        <rect x="10" y="6" width="12" height="10" fill="#f5c5a0"/>
        <!-- eyes -->
        <rect x="13" y="9" width="2" height="2" fill="#1a1a1a"/>
        <rect x="17" y="9" width="2" height="2" fill="#1a1a1a"/>
        <!-- smile -->
        <rect x="13" y="13" width="6" height="1" fill="#c87040"/>
        <rect x="12" y="12" width="2" height="1" fill="#c87040"/>
        <rect x="18" y="12" width="2" height="1" fill="#c87040"/>
        <!-- body -->
        <rect x="9" y="16" width="14" height="18" fill="#ffffff"/>
        <rect x="11" y="18" width="10" height="10" fill="#5bbfbf"/>
        <!-- cross on body -->
        <rect x="15" y="19" width="2" height="8" fill="#cc3333"/>
        <rect x="13" y="22" width="6" height="2" fill="#cc3333"/>
        <!-- arms -->
        <rect x="5" y="16" width="4" height="14" fill="#ffffff"/>
        <rect x="23" y="16" width="4" height="14" fill="#ffffff"/>
        <!-- hands -->
        <rect x="5" y="30" width="4" height="4" fill="#f5c5a0"/>
        <rect x="23" y="30" width="4" height="4" fill="#f5c5a0"/>
        <!-- legs -->
        <rect x="10" y="34" width="5" height="12" fill="#cccccc"/>
        <rect x="17" y="34" width="5" height="12" fill="#cccccc"/>
        <!-- shoes -->
        <rect x="9" y="44" width="6" height="4" fill="#3a3a3a"/>
        <rect x="17" y="44" width="6" height="4" fill="#3a3a3a"/>
      </svg>

      <div class="med-desk">
        <div class="cross-icon"></div>
      </div>

    </div>
  </div>

  <!-- Chairs -->
  <div class="chairs-row">
    <div class="pixel-chair">
      <div class="chair-back"></div>
      <div class="chair-seat"></div>
      <div class="chair-legs"><div class="chair-leg"></div><div class="chair-leg"></div></div>
    </div>
    <div class="pixel-chair">
      <div class="chair-back"></div>
      <div class="chair-seat"></div>
      <div class="chair-legs"><div class="chair-leg"></div><div class="chair-leg"></div></div>
    </div>
    <div class="pixel-chair">
      <div class="chair-back"></div>
      <div class="chair-seat"></div>
      <div class="chair-legs"><div class="chair-leg"></div><div class="chair-leg"></div></div>
    </div>
  </div>

  <!-- Message box -->
  <div class="message-box">
    <p>Muito bem, <span class="name-highlight">PEQUENO HERÓI</span>! 🎉<br>
    Você assistiu este vídeo e está<br>preparado para o exame!</p>
  </div>

  <!-- Buttons -->
  <div class="buttons-row">
    <button class="pixel-btn btn-next" onclick="nextStep()">▶ PRÓXIMA ETAPA</button>
    <button class="pixel-btn btn-menu" onclick="goMenu()">⌂ MENU PRINCIPAL</button>
  </div>

</div>

<script>
  // Animate progress bar
  setTimeout(() => {
    document.getElementById('pbar').classList.add('animated');
  }, 400);

  // Light up stars sequentially
  [1,2,3].forEach((i, idx) => {
    const s = document.getElementById('s' + i);
    if (idx < 2) {
      setTimeout(() => s.classList.add('lit'), 600 + idx * 300);
    }
  });

  // Confetti
  const colors = ['#f0b800','#5bbfbf','#cc3333','#4caf50','#3a7abf','#ffffff'];
  const wrap = document.getElementById('confetti');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = '-20px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    p.style.animationDelay = (Math.random() * 1.5) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    wrap.appendChild(p);
  }

  function nextStep() {
    // Substituir por: window.location.href = 'proxima-etapa.html';
    alert('Indo para a próxima etapa...');
  }
  function goMenu() {
    // Substituir por: window.location.href = 'menu.html';
    alert('Voltando ao menu principal...');
  }
</script>
</body>
</html>
