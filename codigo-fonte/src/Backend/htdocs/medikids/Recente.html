<!DOCTYPE html>
<html lang="pt-br">
    
    <head>
        <link rel="stylesheet" href="css/style.css?v=5">
        <script src="js/script.js" defer></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Acessados Recentemente</title>
        <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2a7895">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Medikids">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <script src="js/pwa-register.js" defer></script>
</head>

    <body class="protected-page child-page">
    <header class="topo">
        <h3 class="logo">LOGO</h3>

        <nav class="navegacao">
            <a class="clicavel" data-link="selecao.html">INÍCIO</a>
            <a href="#" onclick="logout(); return false;">SAIR</a>
            <img class="config-icon" src="img/configuracao_icon_2.png" alt="Configurações" onclick="abrirConfig()">
        </nav>
    </header>


        <h3>Acessados recentemente <img class="topIcon" src="img/timerGif.gif"> </h3>
        <p>Reveja as experiências incríveis que você já passou por aqui!</p>

        <div id="recentes-main" class="recentes-main">
            <p>Carregando experiências...</p>
        </div>

        <button class="button-recentes" onmouseenter="btnHoover()" onclick="irParaInicio()">Início</button>

    <script>
fetch("backend/buscar_recentes.php")
.then(r=>r.json())
.then(d=>{
 const box=document.getElementById("recentes-main");
 if(d.length){
  box.innerHTML=d.map(x=>`<div class="secao"><h5>${x.titulo}</h5><p>${x.tipo}</p></div>`).join("");
 } else {
  box.innerHTML="<p>Nenhuma experiência acessada ainda.</p>";
 }
});
</script>
</body>

</html>
